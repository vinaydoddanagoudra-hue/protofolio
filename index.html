<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinay Basavaraj Doddanagoudra | Full Stack Developer</title>
<style>
:root{
  --bg:#F3F5F9;--surface:#fff;--ink:#0F172A;--text:#334155;--muted:#64748B;--line:#E2E8F0;
  --navy:#0B1431;--navy-2:#162350;--accent:#3B5BDB;--accent-dark:#2B45B0;--accent-soft:#E7ECFD;
  --gold:#C9A24B;--gold-soft:#F6EEDB;--danger:#B42318;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.07);
  --radius-lg:50px;--radius-md:24px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-dark);text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);line-height:1.15;letter-spacing:-.01em}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:56px 0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sec-head{margin-bottom:32px}
.sec-head h2{font-size:2rem;padding-bottom:14px;position:relative}
.sec-head h2::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:4px;border-radius:4px;background:var(--gold)}
.sec-head p{color:var(--muted);max-width:56ch;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:28px}

/* header */
header.site{background:var(--navy);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.08)}
.nav-bar{display:flex;align-items:center;justify-content:space-between;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:700;font-size:1.2rem;color:#fff}
.brand:hover{color:#fff;text-decoration:none}
.brand b{width:38px;height:38px;border-radius:14px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:1rem}
.menu-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer}
.menu-btn:hover{background:#fff;color:var(--navy)}
nav.main{width:100%}
nav.main ul{display:none;list-style:none;padding:4px 0 16px}
nav.main ul.open{display:block}
nav.main li a{display:block;padding:13px 4px;color:#CBD5F5;font-weight:500;border-top:1px solid rgba(255,255,255,.08)}
nav.main li a:hover{color:#fff;text-decoration:none}

/* hero */
.hero{padding:28px 0 24px}
.hero-card{border-radius:var(--radius-lg);padding:36px 24px;display:flex;flex-direction:column;gap:28px;color:#DCE3FA;box-shadow:0 20px 50px rgba(11,20,49,.28);
  background:radial-gradient(circle at 85% 10%,rgba(59,91,219,.55),transparent 55%),radial-gradient(circle at 5% 100%,rgba(201,162,75,.18),transparent 45%),linear-gradient(145deg,var(--navy-2),var(--navy))}
.hero-photo{width:150px;height:150px;border-radius:var(--radius-lg);overflow:hidden;border:4px solid var(--gold);padding:6px;background:rgba(255,255,255,.08);margin:0 auto}
.hero-photo img{width:100%;height:100%;object-fit:cover;border-radius:40px}
.hero h1{font-size:2.5rem;color:#fff;margin-bottom:8px}
.hero .role{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--gold);margin-bottom:16px}
.hero .intro{max-width:54ch;margin-bottom:22px;font-size:1.05rem}
.hero-contact{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.hero-contact li{display:flex;align-items:center;gap:12px}
.hero-contact .icon{color:var(--gold)}
.hero-contact a{color:#fff;word-break:break-word}
.hero-contact a:hover{color:var(--gold)}
.btn-row{display:flex;flex-direction:column;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:999px;font-weight:600;border:2px solid var(--gold)}
.btn:hover{text-decoration:none}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:#fff;border-color:#fff;color:var(--navy)}
.btn-ghost{background:transparent;color:#fff}
.btn-ghost:hover{background:var(--gold);color:var(--navy)}

/* sections */
.about-grid,.skills-grid,.ach-grid{display:grid;gap:20px}
.about-grid h3,.skills-grid h3{font-size:1.25rem;margin-bottom:14px}
.about-main{border-radius:var(--radius-lg);padding:36px 30px;border-left:8px solid var(--accent)}
.about-main p{font-size:1.1rem}
.about-card{border-top:4px solid var(--gold)}
.skill{margin-bottom:18px}.skill:last-child{margin-bottom:0}
.skill-head{display:flex;justify-content:space-between;font-weight:600;color:var(--ink);font-size:.95rem;margin-bottom:8px}
.skill-head span:last-child{color:var(--accent);font-weight:700}
.bar{height:10px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#6D86F0);border-radius:999px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tags span{background:var(--accent-soft);color:var(--accent-dark);border:1px solid #CFD8FA;padding:8px 16px;border-radius:999px;font-weight:600;font-size:.92rem}
.tags span:nth-child(3n){background:var(--gold-soft);color:#7A5C14;border-color:#EBDDB8}
.ach time{display:inline-block;background:var(--gold-soft);color:#7A5C14;font-weight:700;font-size:.85rem;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.ach h3{font-size:1.25rem;margin-bottom:6px}
.ach .sub{color:var(--accent-dark);font-weight:600;margin-bottom:8px}
.ach .more{display:inline-block;margin-top:10px;font-weight:600}
.contact-wrap{border-radius:var(--radius-lg);padding:32px 22px;color:#DCE3FA;box-shadow:0 20px 50px rgba(11,20,49,.22);
  background:radial-gradient(circle at 100% 0,rgba(59,91,219,.45),transparent 55%),linear-gradient(145deg,var(--navy-2),var(--navy))}
.contact-list{list-style:none;display:grid;gap:14px}
.contact-list li{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-md);padding:16px 18px}
.contact-list .ico{width:46px;height:46px;border-radius:16px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.contact-list small{display:block;color:#9FB0E6;font-size:.85rem}
.contact-list a{color:#fff;font-weight:600;word-break:break-word}
.contact-list a:hover{color:var(--gold)}
footer.site{background:var(--navy);color:#9FB0E6;padding:32px 0;margin-top:32px}
.foot{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.foot ul{list-style:none;display:flex;gap:12px}
.foot a{color:#fff;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.foot a:hover{background:var(--gold);border-color:var(--gold);color:var(--navy);text-decoration:none}
.notice{max-width:520px;margin:20vh auto;text-align:center;padding:40px 28px;border-radius:var(--radius-lg)}

/* admin */
.login{max-width:420px;margin:12vh auto;padding:40px 28px;border-radius:var(--radius-lg)}
.login h1{font-size:1.8rem;margin-bottom:6px}
.login p{color:var(--muted);margin-bottom:22px}
label{display:block;font-weight:600;font-size:.9rem;color:var(--ink);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #CBD5E1;border-radius:16px;padding:11px 16px}
textarea{min-height:96px;resize:vertical;border-radius:20px}
.abtn{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:2px solid var(--navy);background:#fff;color:var(--navy);padding:10px 20px}
.abtn:hover{background:var(--navy);color:#fff}
.abtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.abtn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.abtn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.abtn.danger{border-color:var(--danger);color:var(--danger)}
.abtn.danger:hover{background:var(--danger);color:#fff}
.abtn.small{padding:6px 14px;font-size:.88rem}
.err{color:var(--danger);font-weight:600;margin-top:14px;min-height:1.4em}
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;padding:12px 0}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.topbar strong{font-family:var(--serif);font-size:1.15rem}
.topbar .actions{display:flex;flex-wrap:wrap;gap:8px}
.topbar .abtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:8px 16px}
.topbar .abtn:hover{background:#fff;color:var(--navy)}
.topbar .abtn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.status{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0}
.chip{border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:700;background:var(--accent-soft);color:var(--accent-dark)}
.chip.warn{background:var(--gold-soft);color:#7A5C14}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs .abtn.on{background:var(--navy);color:#fff}
.wide{max-width:1500px}
.panes{display:block}
body.tab-edit .previewpane,body.tab-preview .editor{display:none}
.editor details{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);margin-bottom:14px;padding:6px 20px}
.editor summary{cursor:pointer;font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--ink);padding:14px 0}
.editor .inner{padding-bottom:18px}
.item{border:1px solid var(--line);border-radius:20px;padding:6px 16px 16px;margin-top:14px;background:#F8FAFC}
.item .head{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:700;color:var(--ink)}
.strrow{display:flex;gap:8px;margin-top:10px}
.preview{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:auto;background:var(--bg);height:75vh}
.preview header.site{position:static}
.preview .wrap{padding:0 16px}
.preview .hero-card{padding:30px 22px}

/* tablet */
@media (min-width:640px){
  .wrap{padding:0 32px}section{padding:72px 0}
  .sec-head h2{font-size:2.4rem}
  .hero-card{padding:48px 40px}.hero h1{font-size:3rem}
  .btn-row{flex-direction:row}
  .about-grid,.skills-grid,.ach-grid{grid-template-columns:1fr 1fr}
  .about-main{grid-column:1 / -1}
  .contact-wrap{padding:40px 32px}.contact-list{grid-template-columns:1fr 1fr}
}
/* desktop */
@media (min-width:960px){
  .menu-btn{display:none}
  nav.main{width:auto}
  nav.main ul,nav.main ul.open{display:flex;gap:4px;padding:0}
  nav.main li a{border:0;padding:9px 16px;border-radius:999px}
  nav.main li a:hover{background:rgba(255,255,255,.1)}
  .hero{padding-top:40px}
  .hero-card{flex-direction:row-reverse;align-items:center;justify-content:space-between;padding:64px 72px;gap:56px}
  .hero-photo{width:180px;height:180px;margin:0;flex:none}.hero-photo img{border-radius:40px}
  .hero h1{font-size:3.8rem}
  .about-grid{grid-template-columns:1.4fr 1fr}
  .about-main{grid-column:1;grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
  .ach-grid{grid-template-columns:repeat(3,1fr)}
  .contact-wrap{padding:56px}
  .foot{flex-direction:row;justify-content:space-between;text-align:left}
  .tabs{display:none}
  .panes{display:grid;grid-template-columns:minmax(380px,1fr) 1.3fr;gap:24px;align-items:start}
  body.tab-edit .previewpane,body.tab-preview .editor{display:block}
  .previewpane{position:sticky;top:84px}
  .preview{height:calc(100vh - 110px)}
  .preview nav.main ul{display:none}
  .preview .hero-card{flex-direction:column;padding:40px 32px}
  .preview .hero-photo{margin:0 auto}
  .preview .hero h1{font-size:2.4rem}
  .preview .about-grid,.preview .skills-grid,.preview .ach-grid{grid-template-columns:1fr}
  .preview .about-main{grid-row:auto}
}
@media (min-width:1100px){
  .contact-list{grid-template-columns:repeat(5,1fr)}
  .contact-list li{flex-direction:column;text-align:center;padding:26px 16px}
  .preview .contact-list{grid-template-columns:1fr 1fr}
  .preview .contact-list li{flex-direction:row;text-align:left;padding:16px 18px}
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ===== Midnight Aurora theme (dark, cyan and violet) ===== */
:root{color-scheme:dark;--bg:#070B1A;--surface:#0E1530;--ink:#F3F6FF;--text:#B9C5E6;--muted:#8A99C2;--line:rgba(148,163,255,.18);--navy:#050816;--navy-2:#111A48;--accent:#7C6CFF;--accent-dark:#B4ABFF;--accent-soft:rgba(124,108,255,.16);--gold:#22D3EE;--gold-soft:rgba(34,211,238,.14);--shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 40px rgba(0,0,0,.45)}
body{background:radial-gradient(circle at 12% 0,rgba(124,108,255,.24),transparent 38%),radial-gradient(circle at 95% 28%,rgba(34,211,238,.14),transparent 38%),radial-gradient(circle at 10% 75%,rgba(124,108,255,.14),transparent 40%),#070B1A}
a:hover{color:#fff}
.sec-head h2::after{background:linear-gradient(90deg,#22D3EE,#7C6CFF);width:72px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--surface)}
.about-main{border-left-color:#22D3EE}
.about-card{border-top-color:#7C6CFF}
header.site{background:rgba(5,8,22,.94);border-bottom:1px solid rgba(124,108,255,.3)}
.brand b{background:linear-gradient(135deg,#22D3EE,#7C6CFF);color:#050816}
.hero-card{background:radial-gradient(circle at 88% 6%,rgba(124,108,255,.6),transparent 55%),radial-gradient(circle at 0 100%,rgba(34,211,238,.3),transparent 50%),linear-gradient(145deg,#121C4F,#070B1A);border:1px solid rgba(124,108,255,.35);box-shadow:0 0 60px rgba(124,108,255,.25),0 24px 60px rgba(0,0,0,.5)}
.hero-photo{border-color:#22D3EE;box-shadow:0 0 0 6px rgba(124,108,255,.2),0 0 36px rgba(34,211,238,.3)}
.btn-gold{background:linear-gradient(135deg,#22D3EE,#7C6CFF);color:#050816;border-color:transparent}
.btn-gold:hover{background:#fff;border-color:#fff;color:#050816}
.btn-ghost{border-color:#22D3EE}
.btn-ghost:hover{background:#22D3EE;color:#050816}
.skill-head span:last-child{color:#22D3EE}
.bar{background:rgba(255,255,255,.08)}
.bar i{background:linear-gradient(90deg,#22D3EE,#7C6CFF)}
.tags span{border-color:rgba(124,108,255,.4);color:#C9C3FF}
.tags span:nth-child(3n){background:var(--gold-soft);color:#7BE7F5;border-color:rgba(34,211,238,.4)}
.ach time{background:var(--gold-soft);color:#7BE7F5}
.ach .sub{color:#B4ABFF}
.contact-wrap{background:radial-gradient(circle at 100% 0,rgba(124,108,255,.5),transparent 55%),radial-gradient(circle at 0 100%,rgba(34,211,238,.22),transparent 50%),linear-gradient(145deg,#121C4F,#070B1A);border:1px solid rgba(124,108,255,.35);box-shadow:0 0 50px rgba(124,108,255,.2),0 20px 50px rgba(0,0,0,.45)}
.contact-list li{background:rgba(255,255,255,.05);border-color:rgba(148,163,255,.2)}
.contact-list .ico{background:linear-gradient(135deg,#22D3EE,#7C6CFF);color:#050816}
footer.site{background:#050816;border-top:1px solid rgba(124,108,255,.3)}
</style>
</head>
<body data-mode="public">
<div id="app"></div>
<script>
(function () {
  var PLACEHOLDER = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23E7ECFD'/%3E%3Ccircle cx='100' cy='78' r='38' fill='%233B5BDB'/%3E%3Cpath d='M28 200c0-46 32-74 72-74s72 28 72 74z' fill='%233B5BDB'/%3E%3C/svg%3E";
  var SPRITE = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' +
    '<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>' +
    '<symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>' +
    '<symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></symbol>' +
    '<symbol id="i-linkedin" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></symbol>' +
    '<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>' +
    '<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol></svg>';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function href(u) { u = String(u || "").trim(); return /^(https?:\/\/|mailto:|tel:)/i.test(u) ? esc(u) : "#"; }
  function short(u) { return String(u || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""); }
  function ic(n) { return '<svg class="icon" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function ext(u) { return 'href="' + href(u) + '" target="_blank" rel="noopener noreferrer"'; }
  function initials(n) { return String(n || "").split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join(""); }
  function sec(id, title, sub, inner) {
    return '<section id="' + id + '"><div class="wrap"><div class="sec-head"><h2>' + title + "</h2><p>" + sub + "</p></div>" + inner + "</div></section>";
  }
  function cards(list, f) {
    return '<div class="ach-grid">' + list.map(function (x) {
      return '<article class="card ach">' + (f.date(x) ? "<time>" + esc(f.date(x)) + "</time>" : "") + "<h3>" + esc(f.title(x)) + "</h3>" +
        (f.sub && f.sub(x) ? '<p class="sub">' + esc(f.sub(x)) + "</p>" : "") + (f.text(x) ? "<p>" + esc(f.text(x)) + "</p>" : "") +
        (f.link && /^https?:/i.test(f.link(x) || "") ? '<a class="more" ' + ext(f.link(x)) + ">View project</a>" : "") + "</article>";
    }).join("") + "</div>";
  }

  function build(d) {
    var p = d.profile, a = d.about, nav = [["about", "About"]], html = "";
    var photo = /^(https?:\/\/|data:image\/)/i.test(p.photo) ? esc(p.photo) : PLACEHOLDER;
    var email = p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + "</a>" : "";
    var phone = p.phone ? '<a href="tel:' + esc(p.phone.replace(/[^\d+]/g, "")) + '">' + esc(p.phone) + "</a>" : "";

    html += '<section class="hero"><div class="wrap"><div class="hero-card"><div class="hero-photo"><img src="' + photo + '" alt="Profile photo of ' + esc(p.name) + '"></div><div>' +
      "<h1>" + esc(p.name) + '</h1><p class="role">' + esc(p.title) + '</p><p class="intro">' + esc(p.intro) + '</p><ul class="hero-contact">' +
      (email ? "<li>" + ic("mail") + email + "</li>" : "") + (phone ? "<li>" + ic("phone") + phone + "</li>" : "") + '</ul><div class="btn-row">' +
